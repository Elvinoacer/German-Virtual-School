name: Recurring Billing Cron Job

on:
  schedule:
    # Run once every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

jobs:
  trigger-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Recurring Billing API
        run: |
          curl -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/finance/jobs/recurring-billing" \
          -H "Content-Type: application/json" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
